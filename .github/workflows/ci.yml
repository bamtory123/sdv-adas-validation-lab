name: ci

on:
  push:
  pull_request:

jobs:
  unit-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv run python -m sdv_adas_validation_lab.release_audit $(git ls-files)
      - run: uv run python -m sdv_adas_validation_lab.report --runs tests --output /tmp/report.md
      - run: uv run python -m sdv_adas_validation_lab.evidence --evaluation redacted-sample samples/evidence/ground-truth.json --runs samples/evidence/replay --output /tmp/evidence.md
