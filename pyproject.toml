[project]
name = "sdv-adas-validation-lab"
version = "0.1.0"
description = "Reproducible camera sensor-runtime validation for ADAS portfolios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cuda-python>=13.3.1",
    "onnx>=1.22.0",
    "onnxruntime-gpu>=1.29.0",
    "pillow>=12.3.0",
    "tensorrt==10.16.1.11",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
