[project]
name = "sdv-adas-validation-lab"
version = "0.1.0"
description = "Reproducible camera sensor-runtime validation for ADAS portfolios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
